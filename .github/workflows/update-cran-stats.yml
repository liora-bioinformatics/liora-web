name: Update CRAN download stats

# The figures shown on the package pages are committed to the repo rather than
# fetched in the browser, because cranlogs.r-pkg.org sends no CORS header and a
# browser cannot read it cross-origin. This job keeps the committed copy fresh.
#
# Note: GitHub disables scheduled workflows in a repository that has had no
# activity for 60 days. If the numbers ever stop moving, check the Actions tab
# first — that is the usual cause.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-cran-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch download figures
        run: python3 tools/update-cran-stats.py

      - name: Commit if the figures changed
        run: |
          # git status, not git diff: diff reports nothing for an untracked
          # file, so a first run would silently skip its own new output.
          if [ -z "$(git status --porcelain -- assets/data/cran-stats.json)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/cran-stats.json
          git commit -m "Update CRAN download statistics"
          git push
